riskhouse:
  target: dev
  outputs:
    # Local development: DuckDB file reading data/landing. `dbt build`
    dev:
      type: duckdb
      path: riskhouse.duckdb
      threads: 4

    # Production: Databricks (Free Edition works). `dbt build --target databricks`, after the landing notebook.
    # Credentials come from environment variables and are never committed. See docs/databricks.md.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'set-DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', 'set-DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'set-DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: dev
      threads: 4

    # Local Apache Spark, the engine under Databricks: CI checks gold is identical to DuckDB. `dbt build --target spark`
    spark:
      type: spark
      method: session
      host: localhost
      schema: dev
      threads: 1
